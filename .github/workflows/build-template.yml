name: Build Template From Dev

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-template:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and generate template export
        run: npm run template:check

      - name: Publish export to main
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv .template-export /tmp/template-export

          if git ls-remote --exit-code origin main; then
            git fetch origin main
            git switch -C main origin/main
          else
            git switch --orphan main
          fi

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R /tmp/template-export/. .
          rm -rf /tmp/template-export

          git add -A
          if git diff --cached --quiet; then
            echo "No template changes to commit."
            exit 0
          fi

          git commit -m "chore: sync template from dev"
          git push origin main --force
